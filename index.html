<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080908" />
  <meta name="description" content="Nguyen Hai Nam. Engineering, technology access, community, and analog sound. A personal collection, one record at a time." />
  <title>Nguyen Hai Nam — Personal records</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <a class="skip-link" href="#introduction">Skip to introduction</a>
  <nav id="record-index" aria-label="Record index" hidden></nav>
  <main id="home">
    <section id="introduction" aria-label="A few parts of my world">
      <div class="biography"><figure class="portrait"><div class="portrait-surface" id="portrait-surface"><img class="portrait-image" alt="" /></div><figcaption id="portrait-caption"></figcaption></figure><div class="biography-copy"><h1>Hi, I’m Nam.</h1><p class="biography-lead"></p><div id="biography-background"></div><a class="collection-invitation" href="#collection">Explore my collection ↓</a></div></div>
    </section>

    <section id="collection" class="listening-section" aria-labelledby="collection-title">
      <div class="collection-heading"><h2 id="collection-title">My collection.</h2><p>Click to discover a record. Click it again to play.</p></div>
      <div class="record-info" aria-live="polite"><div><h3 id="active-title"></h3><p id="active-description"></p></div><button id="place-record" class="place-action">Play record <span>↗</span></button></div>
      <div id="collection-scene" class="listening-scene" aria-label="Hover to lift a sleeve. Click once for its description above the crate, then click the same sleeve again to play. Dragging to the turntable is also available."><div class="scene-hits"></div><div class="fallback-scene"><p>The 3D scene is unavailable. Select a story from the collection below.</p></div></div>
      <div class="collection-bottom"><p id="collection-status" class="scene-status" role="status"></p></div>
      <div id="record-list" class="record-list" aria-label="All eight sections"></div>
      <nav class="collection-nav" aria-label="Collection navigation"><a href="#introduction">About me</a><button id="index-toggle" aria-expanded="false" aria-controls="record-index">Index</button><a href="/resume.html" target="_blank" rel="noopener">Résumé</a><button id="motion-toggle" aria-pressed="false">Reduce motion</button></nav>
    </section>
  </main>
  <main id="detail" hidden></main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
